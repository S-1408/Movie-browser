# A "workflow" is an automated process GitHub runs for you.
# Any .yml file in .github/workflows/ is picked up automatically.
name: CI

# TRIGGERS: when should this workflow run?
on:
  push:
    branches: [master]   # every push to master
  pull_request:
    branches: [master]   # every PR that targets master

# If you push twice quickly, cancel the older run instead of running both.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# A workflow is made of one or more JOBS. Each job runs on a fresh virtual machine.
jobs:
  build:
    name: Lint, Test & Build
    runs-on: ubuntu-latest   # the VM type (a clean Linux machine, every time)

    # The app lives in movie-browser/, not the repo root, so every "run:" command runs there.
    # (This only affects "run:" steps. "uses:" steps need their paths set themselves, see below.)
    defaults:
      run:
        working-directory: movie-browser

    # STEPS run in order, inside the job. If any step fails, the job fails.
    steps:
      # 1. The VM starts empty — download your repo's code onto it.
      - name: Checkout code
        uses: actions/checkout@v4   # "uses" = run a prebuilt action from the marketplace

      # 2. Install Node.js. cache: npm reuses downloaded packages between runs (faster).
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: movie-browser/package-lock.json # not at the repo root

      # 3. Install exact versions from package-lock.json ("run" = a shell command).
      #    npm ci is like npm install, but strict and reproducible — made for CI.
      - name: Install dependencies
        run: npm ci

      # 4. Catch code-quality problems.
      - name: Lint
        run: npm run lint

      # 5. Run the unit tests (Vitest). They don't call TMDB, so no token needed.
      - name: Test
        run: npm test

      # 6. Make sure the app actually compiles.
      #    The build prerenders pages that call TMDB, so it needs the token.
      #    secrets.TMDB_API_TOKEN comes from GitHub repo settings — it's never in the code,
      #    and GitHub hides it (***) if it ever appears in logs.
      - name: Build
        run: npm run build
        env:
          TMDB_API_TOKEN: ${{ secrets.TMDB_API_TOKEN }}

      # 7. End-to-end tests: Playwright opens a real browser and clicks through the app.
      #    playwright.config.ts starts the production server (npm run start) for us.
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        run: npm run test:e2e
        env:
          TMDB_API_TOKEN: ${{ secrets.TMDB_API_TOKEN }}

      # If E2E fails, save the report (screenshots + traces) so you can download it
      # from the workflow run page and see exactly what went wrong.
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            movie-browser/playwright-report/
            movie-browser/test-results/
          retention-days: 7

  # A second job: build the Docker image, and publish it when code lands on master.
  docker:
    name: Docker image
    needs: build             # wait for "Lint, Test & Build" — if it fails, this job is skipped
    runs-on: ubuntu-latest

    # The built-in GITHUB_TOKEN may only read code by default; it needs
    # "packages: write" to publish to GitHub Container Registry (ghcr.io)
    permissions:
      contents: read
      packages: write

    # Publish only for pushes to master. For pull requests, just check that the image builds.
    env:
      PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Buildx = Docker's modern builder; needed for build secrets and layer caching
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }} # created by GitHub for every run, nothing to set up

      # Image name and tags, e.g. ghcr.io/s-1408/movie-browser:latest and :sha-67c4411
      # (also lowercases the name, which ghcr.io requires)
      - name: Image name and tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/movie-browser
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=ref,event=pr

      # The Dockerfile mounts .env.local as a build secret (for prerendering pages
      # that call TMDB). Create it from the GitHub secret; it never ends up in the image.
      - name: Create .env.local for the build
        run: echo "TMDB_API_TOKEN=${{ secrets.TMDB_API_TOKEN }}" > movie-browser/.env.local

      - name: Build (and publish on master)
        uses: docker/build-push-action@v6
        with:
          context: movie-browser
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          secret-files: env=movie-browser/.env.local
          cache-from: type=gha       # reuse unchanged layers from earlier runs (much faster)
          cache-to: type=gha,mode=max
